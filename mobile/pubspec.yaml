name: spectra
description: AI-powered scam detection mobile application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Typography
  google_fonts: ^6.2.1

  # Networking
  dio: ^5.7.0

  # Image Picker
  image_picker: ^1.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Local storage
  shared_preferences: ^2.3.3

  # Utilities
  intl: ^0.19.0
  path: ^1.9.0

  # Supabase
  supabase_flutter: ^2.8.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
